<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主任月費用 — 費用管理</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">

    <div class="page-header">
      <div>
        <div class="eyebrow">主任月費用</div>
        <h1>主任月費用</h1>
        <div class="desc">以會計代號分卡管理每月費用，並自動計算主任墊款與中心／學校／醫院之間的對帳結果。</div>
      </div>
      <div class="header-actions no-print">
        <div class="month-picker">
          <select id="monthSelect"></select>
        </div>
        <button class="btn btn-outline" id="btnNewMonth">＋ 新增月份</button>
        <button class="btn btn-primary" id="btnDownloadPdf">下載 PDF 報告</button>
      </div>
    </div>

    <div id="reportRoot">

      <div class="divider-label">本月對帳結算 · <span id="curMonthLabel"></span></div>
      <table class="recon-table" id="reconTable" style="margin-bottom:26px;"></table>

      <div class="summary-strip" id="cumStrip" style="margin-bottom:8px;"></div>
      <div class="hint-banner" id="cumHint" style="margin-bottom:26px;"></div>

      <div class="divider-label">費用明細（依會計代號分卡）</div>
      <div id="cardsRoot"></div>

    </div>
  </main>
</div>

<!-- 新增／編輯 modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新增費用項目</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="form-grid" id="formGrid">
      <div class="form-field">
        <label>所屬卡片／會計代號</label>
        <select id="fCategory"></select>
      </div>
      <div class="form-field">
        <label>資金來源</label>
        <select id="fFund">
          <option value="hospital">醫院</option>
          <option value="center">中心</option>
          <option value="school">學校</option>
          <option value="external">外部</option>
        </select>
      </div>
      <div class="form-field">
        <label>發生月份</label>
        <input type="month" id="fMonth">
      </div>
      <div class="form-field"></div>
      <div class="form-field span-2">
        <label>項目</label>
        <input type="text" id="fItem" placeholder="例如：軟體工具使用費">
      </div>
      <div class="form-field span-2">
        <label>次項目 / 說明</label>
        <input type="text" id="fSubitem" placeholder="例如：06月份（Claude Pro、iCloud）">
      </div>
      <div class="form-field">
        <label>支出金額</label>
        <input type="number" id="fExpense" placeholder="0">
      </div>
      <div class="form-field">
        <label>收入金額（撥入款項）</label>
        <input type="number" id="fIncome" placeholder="0">
      </div>
      <div class="form-field span-2">
        <label>備註</label>
        <textarea id="fNote" placeholder="核銷狀態、傳票號碼等"></textarea>
      </div>
      <div class="form-field span-2">
        <div class="checkline"><input type="checkbox" id="fAdvanced"> 這筆是主任自己先墊付的錢（需要歸還）</div>
      </div>
      <div class="form-field span-2" id="settledWrap" style="display:none">
        <div class="checkline"><input type="checkbox" id="fSettled"> 已經入帳／歸還給主任</div>
      </div>
      <div class="form-field" id="settledMonthWrap" style="display:none">
        <label>入帳月份（可與發生月份不同，用於下月沖帳）</label>
        <input type="month" id="fSettledMonth">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">儲存</button>
    </div>
  </div>
</div>

<script src="assets/seed.js"></script>
<script src="assets/app.js"></script>
<script>
ensureSeeded();
renderSidebar('director');

const MODULE = 'director';
let currentMonth = null;
let editingId = null;

function init(){
  const entries = getEntries(MODULE);
  let months = allMonths(entries);
  if(months.length===0){ months = [currentMonthStr()]; }
  const cm = currentMonthStr();
  currentMonth = months.includes(cm) ? cm : months[months.length-1];
  buildMonthOptions(document.getElementById('monthSelect'), months, currentMonth);
  renderAll();
}

document.getElementById('monthSelect').onchange = (e)=>{
  currentMonth = e.target.value;
  renderAll();
};

document.getElementById('btnNewMonth').onclick = ()=>{
  const entries = getEntries(MODULE);
  const months = allMonths(entries);
  const base = months.length ? months[months.length-1] : currentMonthStr();
  const next = nextMonthStr(base);
  if(!months.includes(next)) months.push(next);
  months.sort();
  currentMonth = next;
  buildMonthOptions(document.getElementById('monthSelect'), months, currentMonth);
  renderAll();
};

document.getElementById('btnDownloadPdf').onclick = ()=>{
  downloadPdf('reportRoot', `主任月費用_${currentMonth}.pdf`);
};

function fundLabel(k){ return FUND_SOURCES.find(f=>f.key===k)?.label || k; }
function fundChip(k){
  const map = {hospital:'fund-hospital', center:'fund-center', school:'fund-school', external:'fund-external'};
  return `<span class="fund-chip ${map[k]||''}"><span class="dot"></span>${fundLabel(k)}</span>`;
}

function renderAll(){
  document.getElementById('curMonthLabel').textContent = monthLabel(currentMonth);
  renderReconTable();
  renderCumulative();
  renderCards();
}

function renderReconTable(){
  const recon = directorReconForMonth(currentMonth);
  const rows = [
    { label:'主任本月新增墊付（待歸還）', data: recon.owedNew, cls:'' },
    { label:'代轉款項（主任無需歸還）', data: recon.passthrough, cls:'' },
    { label:'本月已入帳給主任（含沖去年月墊款）', data: recon.settledThisMonth, cls:'' },
  ];
  const totalRow = FUND_SOURCES.reduce((acc,f)=>{
    acc[f.key] = (recon.owedNew[f.key]||0);
    return acc;
  },{});

  let html = '<thead><tr><th>項目 / 資金來源</th>';
  FUND_SOURCES.forEach(f=> html += `<th>${fundChip(f.key)}</th>`);
  html += '<th>合計</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html += `<tr><td>${r.label}</td>`;
    let sum = 0;
    FUND_SOURCES.forEach(f=>{ const v=r.data[f.key]||0; sum+=v; html+=`<td>${fmtMoney(v)}</td>`; });
    html += `<td>${fmtMoney(sum)}</td></tr>`;
  });
  // 合計列：本月待給主任總額（新增未清償）
  let grand = 0;
  html += `<tr><td>本月應付主任總額</td>`;
  FUND_SOURCES.forEach(f=>{ const v = recon.owedNew[f.key]||0; grand+=v; html+=`<td>${fmtMoney(v)}</td>`; });
  html += `<td>${fmtMoney(grand)}</td></tr>`;
  html += '</tbody>';
  document.getElementById('reconTable').innerHTML = html;
}

function renderCumulative(){
  const cum = directorOutstandingUpTo(currentMonth);
  const all = directorAllOutstanding();
  document.getElementById('cumStrip').innerHTML = `
    <div class="stat-card owe">
      <div class="label">累計至本月尚未歸還主任</div>
      <div class="value">$ ${fmtMoney(cum.total)}</div>
    </div>
    <div class="stat-card owe">
      <div class="label">目前（含所有月份）累計未歸還</div>
      <div class="value">$ ${fmtMoney(all.total)}</div>
    </div>
  `;
  const hint = document.getElementById('cumHint');
  if(all.total > 0){
    const lines = all.entries.slice(0,4).map(e=> `${monthLabel(e.month)} · ${e.item} · $${fmtMoney(e.expense)}`);
    hint.style.display='block';
    hint.innerHTML = `目前尚有 <strong>${all.entries.length}</strong> 筆墊款尚未歸還主任，最舊的幾筆：<br>` + lines.join('<br>') +
      (all.entries.length>4? `<br>...等，完整清單請見「歷年對帳」頁面。`:'');
  } else {
    hint.style.display='block';
    hint.innerHTML = '目前沒有任何積欠主任的墊款，帳務已全部結清 ✓';
  }
}

function renderCards(){
  const entries = getEntries(MODULE).filter(e=>e.month===currentMonth);
  const root = document.getElementById('cardsRoot');
  root.innerHTML = DIRECTOR_CATEGORIES.map(cat=>{
    const list = entries.filter(e=>e.category===cat.key);
    const outstanding = list.filter(e=>e.directorAdvanced && !e.settled).reduce((s,e)=>s+(Number(e.expense)||0),0);

    const rowsHtml = list.length ? `
      <table class="entry-table">
        <thead><tr>
          <th>項目 / 次項目</th><th>資金來源</th><th>狀態</th><th style="text-align:right">支出</th><th style="text-align:right">收入</th><th>備註</th><th></th>
        </tr></thead>
        <tbody>
        ${list.map(e=>{
          let tag = '<span class="tag tag-pass">代轉／無需歸還</span>';
          if(e.directorAdvanced && e.settled) tag = '<span class="tag tag-settled">已入帳 · '+monthLabel(e.settledMonth)+'</span>';
          else if(e.directorAdvanced && !e.settled) tag = '<span class="tag tag-owe">待歸還主任</span>';
          return `<tr>
            <td><div class="item-main">${e.item||''}</div>${e.subitem?`<div class="item-sub">${e.subitem}</div>`:''}</td>
            <td>${fundChip(e.fundSource)}</td>
            <td>${tag}</td>
            <td class="num">${fmtMoney(e.expense)}</td>
            <td class="num">${fmtMoney(e.income)}</td>
            <td class="note">${e.note||''}</td>
            <td class="no-print"><div class="row-actions">
              <button class="icon-btn" onclick="openEdit('${e.id}')">編輯</button>
              <button class="icon-btn" onclick="removeEntry('${e.id}')">刪除</button>
            </div></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    ` : `<div class="entry-empty">本月無費用</div>`;

    return `
      <div class="category-card">
        <div class="category-head">
          <div class="category-head-left">
            <div class="category-title">${cat.label}</div>
            ${cat.code ? `<div class="code-stub">會計代號 ${cat.code}</div>` : ''}
          </div>
          <div class="category-subtotal">
            ${outstanding>0 ? `本月待歸還 <span class="owe-amt">$${fmtMoney(outstanding)}</span>` : '本月無待歸還款項'}
          </div>
        </div>
        ${rowsHtml}
        <div class="card-foot no-print">
          <button class="btn btn-sm btn-outline" onclick="openAdd('${cat.key}')">＋ 新增這張卡片的項目</button>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------- modal ---------- */
function populateCategorySelect(selectedKey){
  const sel = document.getElementById('fCategory');
  sel.innerHTML = DIRECTOR_CATEGORIES.map(c=>`<option value="${c.key}" ${c.key===selectedKey?'selected':''}>${c.label}${c.code? ' · '+c.code:''}</option>`).join('');
}
function toggleAdvancedFields(){
  const adv = document.getElementById('fAdvanced').checked;
  document.getElementById('settledWrap').style.display = adv ? 'flex' : 'none';
  document.getElementById('settledWrap').style.flexDirection='column';
  const settled = document.getElementById('fSettled').checked;
  document.getElementById('settledMonthWrap').style.display = (adv && settled) ? 'flex' : 'none';
  document.getElementById('settledMonthWrap').style.flexDirection='column';
}
document.getElementById('fAdvanced').onchange = toggleAdvancedFields;
document.getElementById('fSettled').onchange = toggleAdvancedFields;

function openAdd(categoryKey){
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增費用項目';
  populateCategorySelect(categoryKey);
  const defaultFund = categoryKey==='hospital_expense' ? 'hospital' : 'school';
  document.getElementById('fFund').value = defaultFund;
  document.getElementById('fMonth').value = currentMonth;
  document.getElementById('fItem').value = '';
  document.getElementById('fSubitem').value = '';
  document.getElementById('fExpense').value = '';
  document.getElementById('fIncome').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fAdvanced').checked = (categoryKey!=='passthrough');
  document.getElementById('fSettled').checked = false;
  document.getElementById('fSettledMonth').value = currentMonth;
  toggleAdvancedFields();
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(id){
  const e = getEntries(MODULE).find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '編輯費用項目';
  populateCategorySelect(e.category);
  document.getElementById('fFund').value = e.fundSource;
  document.getElementById('fMonth').value = e.month;
  document.getElementById('fItem').value = e.item||'';
  document.getElementById('fSubitem').value = e.subitem||'';
  document.getElementById('fExpense').value = e.expense||'';
  document.getElementById('fIncome').value = e.income||'';
  document.getElementById('fNote').value = e.note||'';
  document.getElementById('fAdvanced').checked = !!e.directorAdvanced;
  document.getElementById('fSettled').checked = !!e.settled;
  document.getElementById('fSettledMonth').value = e.settledMonth || e.month;
  toggleAdvancedFields();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('btnCancel').onclick = closeModal;

document.getElementById('btnSave').onclick = ()=>{
  const advanced = document.getElementById('fAdvanced').checked;
  const settled = advanced && document.getElementById('fSettled').checked;
  const payload = {
    category: document.getElementById('fCategory').value,
    fundSource: document.getElementById('fFund').value,
    month: document.getElementById('fMonth').value || currentMonth,
    item: document.getElementById('fItem').value.trim(),
    subitem: document.getElementById('fSubitem').value.trim(),
    expense: Number(document.getElementById('fExpense').value)||0,
    income: Number(document.getElementById('fIncome').value)||0,
    note: document.getElementById('fNote').value.trim(),
    directorAdvanced: advanced,
    settled: settled,
    settledMonth: settled ? (document.getElementById('fSettledMonth').value || payloadMonthFallback()) : null,
  };
  function payloadMonthFallback(){ return document.getElementById('fMonth').value || currentMonth; }

  if(!payload.item){ alert('請輸入項目名稱'); return; }

  if(editingId){ updateEntry(MODULE, editingId, payload); }
  else{ addEntry(MODULE, payload); }

  // 若新增/編輯到目前未在下拉選單中的月份，更新月份清單
  const months = allMonths(getEntries(MODULE));
  if(!months.includes(currentMonth)) months.push(currentMonth);
  buildMonthOptions(document.getElementById('monthSelect'), months.sort(), payload.month);
  currentMonth = payload.month;

  closeModal();
  renderAll();
};

function removeEntry(id){
  if(!confirm('確定要刪除這筆項目嗎？')) return;
  deleteEntry(MODULE, id);
  renderAll();
}

init();
</script>
</body>
</html>
